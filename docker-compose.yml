services:
  campus-motion:
    build:
      context: .
      args:
        # Reads VITE_API_BASE_URL from your shell or a .env file at compose level
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: campus-motion:latest
    container_name: campus-motion
    restart: unless-stopped
    ports:
      - "80:80"
